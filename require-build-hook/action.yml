name: Require a build hook
description: >
  Fails when a package has a build script but no npm lifecycle hook to run it. The publish
  workflows have no explicit build step, so a package in that state publishes whatever
  happens to be on disk — usually nothing — on an otherwise green run. This is the single
  definition of that rule across the organisation.

  Expects the calling job to have run actions/checkout and actions/setup-node already: the
  package.json is read from the checkout, using node.
inputs:
  package-dir:
    description: >
      Directory containing the package.json to check, relative to the repo root. Defaults
      to the root itself; pass a workspace path for a monorepo.
    required: false
    default: .
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
      run: |
        set -euo pipefail
        node -e '
          const pkg = require(`${process.cwd()}/${process.env.PACKAGE_DIR}/package.json`)
          const scripts = pkg.scripts || {}
          const hooks = ["prepare", "prepack", "prepublishOnly"].filter((h) => scripts[h])
          if (!scripts.build) {
            console.log(`${pkg.name} has no build script, so there is nothing for a hook to run.`)
          } else if (!hooks.length) {
            console.log(`::error::${pkg.name} has a build script but no prepare, prepack or prepublishOnly to run it, so npm publish would package whatever happens to be on disk. Add one.`)
            process.exit(1)
          } else {
            console.log(`Build hook(s) present: ${hooks.join(", ")}`)
          }
        '
