name: Publish npm package

on:
  workflow_call:
    inputs:
      labels:
        description: >
          JSON array of the merged pull request's label names. Pass
          toJSON(github.event.pull_request.labels.*.name).
        required: true
        type: string
    outputs:
      version:
        description: The version that was published.
        value: ${{ jobs.publish.outputs.version }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish npm package with OIDC
    runs-on: ubuntu-24.04
    env:
      REGISTRY: https://registry.npmjs.org
    outputs:
      version: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Require a build hook where there is a build to run
        uses: sellpy/package-release-actions/require-build-hook@v1

      - name: Resolve semantic version bump
        id: bump
        uses: sellpy/package-release-actions/semver-label@v1
        with:
          labels: ${{ inputs.labels }}

      - name: Clean npm install
        run: npm ci

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: ${{ env.REGISTRY }}
          package-manager-cache: false

      - name: Prepare npm for trusted publishing
        run: |
          : > .npmrc
          npm install --global 'npm@^11.21.0' --registry="$REGISTRY"

      - name: Resolve next version from registry
        id: version
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          TAGS="$(npm dist-tag ls "$NAME" --registry="$REGISTRY")"
          CURRENT="$(printf '%s\n' "$TAGS" | awk '$1 == "latest:" {print $2}')"
          if [ -z "$CURRENT" ]; then
            echo "::error::$NAME has no valid latest dist-tag on $REGISTRY. Publish the first version or restore latest before retrying."
            exit 1
          fi
          npm pkg set version="$CURRENT"
          NEXT="$(npm version --no-git-tag-version --allow-same-version "$BUMP")"
          NEXT="${NEXT#v}"
          echo "Registry latest is $CURRENT, publishing $NEXT ($BUMP)"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Publish npm version
        run: npm publish --registry="$REGISTRY"

      - name: Tag published version
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git tag "v$VERSION"
          git push origin "v$VERSION"
